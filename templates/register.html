<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Register</h1>
    <nav>
      <a href="/">Home</a>
      {% if session.get('user_id') %}
        | <a href="/profile/{{ session.get('user_id') }}">My Account</a>
        | <a href="/logout">Logout</a>
      {% else %}
        | <a href="/login">Login</a>
      {% endif %}
    </nav>
  </header>
  <main>
    <form method="post" action="/register">
      <label>Username: <input name="name" required></label><br>
      <label>Password: <input name="password" type="password" required></label><br>
      <label>Card (standard/social/gold): <input name="card"></label><br>
      <button type="submit">Create account</button>
    </form>
  </main>
</body>
</html>
