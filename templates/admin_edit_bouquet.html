<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Edit Bouquet</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>Edit Bouquet</h1><nav><a href="/admin/bouquets">Back</a></nav></header>
  <main>
    <form method="post" action="/admin/bouquets/edit/{{ bouquet.id }}">
      <label>Name: <input name="name" value="{{ bouquet.name }}"></label><br>
      <button type="submit">Save</button>
    </form>
    <h2>Positions</h2>
    <h3>Create new position</h3>
    <form method="post" action="/admin/bouquets/create_position/{{ bouquet.id }}">
      <label>Price: <input name="price"></label>
      <label>Stock: <input name="quantity" type="number" min="0" value="0"></label>
      <button type="submit">Create position</button>
    </form>
    <ul>
      {% for p in positions %}
        <li>Price: {{ p.price }} — Stock: {{ p.quantity }}
          <form method="post" action="/admin/positions/update/{{ p.id }}" style="display:inline">
            <input name="quantity" type="number" min="0" value="{{ p.quantity }}" style="width:5rem">
            <button type="submit">Set</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  </main>
</body>
</html>
