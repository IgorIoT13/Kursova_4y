<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Profile</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Profile</h1>
    <nav>
      <a href="/">Home</a> | <a href="/shop">Shop</a>
      {% if session.get('user_id') %}
        | <a href="/profile/{{ session.get('user_id') }}">My Account</a>
        | <a href="/cart">Cart</a>
        | <a href="/logout">Logout</a>
      {% else %}
        | <a href="/login">Login</a>
      {% endif %}
    </nav>
  </header>
  <main>
    <h2>{{ user.name }}</h2>
    <p>Card: {{ user.card or 'none' }}</p>
    <p>Joined: {{ user.created_at }}</p>
  </main>
</body>
</html>
