<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flower Shop - Home</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Flower Shop</h1>
    <nav>
      <a href="/shop">Shop</a>
      {% if session.get('user_id') %}
        | <a href="/profile/{{ session.get('user_id') }}">My Account</a>
        | <a href="/cart">Cart</a>
        | <a href="/logout">Logout</a>
      {% else %}
        | <a href="/login">Login</a>
      {% endif %}
    </nav>
  </header>
  <main>
    <h2>Welcome</h2>
    <p>This is a minimal demo page served by Flask templates stored in the repo.</p>
  </main>
  <footer>
    <small>Demo shop</small>
  </footer>
</body>
</html>
