<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Create Bouquet</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><h1>Create Bouquet</h1><nav><a href="/">Home</a> | <a href="/shop">Shop</a></nav></header>
  <main>
    <form method="post" action="/create_bouquet">
      <label>Name: <input name="name" required></label><br>
      <label>Flower: <select name="flower_id">{% for f in flowers %}<option value="{{ f.id }}">{{ f.name }}</option>{% endfor %}</select></label><br>
      <label>Wrapping: <select name="wrapping_id">{% for w in wrappings %}<option value="{{ w.id }}">{{ w.name }}</option>{% endfor %}</select></label><br>
      <label>Type: <select name="type_id">{% for t in types %}<option value="{{ t.id }}">{{ t.type }}</option>{% endfor %}</select></label><br>
      <label>Flowers count: <input type="number" name="flowers_count" value="1" min="1"></label><br>
  <p>Price and sale stock are managed by the shop. You can choose how many you want to buy now; that amount will be added to your cart.</p>
  <label>Quantity to add to cart: <input type="number" name="add_quantity" value="1" min="1"></label><br>
      <button type="submit">Create</button>
    </form>
  </main>
</body>
</html>
